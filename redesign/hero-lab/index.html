<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hero lab — three sculptures</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap">
<style>
  :root{
    --paper:#F7F4EF;
    --ink:#16130F;
    --text:#2E2A24;
    --text-muted:#6B655B;
    --line:#DDD6C8;
    --flare:#E4622F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--paper);color:var(--text);overflow:hidden;
    font-family:Satoshi,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;}

  /* the stage carries the same clip-path mechanism the real hero now uses, so the sculpture can be
     judged full-bleed AND at its settled card size without rebuilding the scene. */
  #stage{position:fixed;inset:0;
    --ci-t:0px;--ci-x:0px;--ci-b:0px;--ci-rad:0px;
    clip-path:inset(var(--ci-t) var(--ci-x) var(--ci-b) var(--ci-x) round var(--ci-rad));
    transition:clip-path .7s cubic-bezier(.65,0,.35,1);
    will-change:clip-path;background:var(--paper);}
  body.carded #stage{--ci-t:88px;--ci-x:40px;--ci-b:340px;--ci-rad:28px;}
  @media(max-width:760px){ body.carded #stage{--ci-t:72px;--ci-x:18px;--ci-b:300px;--ci-rad:22px;} }
  #stage canvas{display:block;width:100%;height:100%;}

  .brand{position:fixed;top:26px;left:32px;z-index:5;font-weight:900;letter-spacing:-.02em;
    font-size:15px;color:var(--ink);}
  .brand span{color:var(--flare);}

  .readout{position:fixed;top:24px;right:32px;z-index:5;text-align:right;max-width:min(42vw,340px);}
  .readout h1{margin:0;font-size:clamp(19px,2.2vw,26px);font-weight:700;letter-spacing:-.02em;
    line-height:1.1;color:var(--ink);}
  .readout p{margin:7px 0 0;font-size:13px;line-height:1.5;color:var(--text-muted);}

  .dock{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:6;
    display:flex;gap:8px;padding:7px;border-radius:999px;
    background:rgba(247,244,239,.86);backdrop-filter:saturate(1.2) blur(10px);
    box-shadow:0 10px 30px -14px rgba(40,32,22,.5), inset 0 0 0 1px rgba(221,214,200,.7);}
  .dock button{appearance:none;border:0;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;
    padding:11px 20px;border-radius:999px;background:transparent;color:var(--text);
    transition:background .25s ease,color .25s ease;white-space:nowrap;}
  .dock button:hover{background:rgba(22,19,15,.06);}
  .dock button[aria-pressed="true"]{background:var(--flare);color:#fff;}
  .dock .sep{width:1px;margin:6px 3px;background:var(--line);}

  .fps{position:fixed;left:32px;bottom:32px;z-index:5;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--text-muted);font-variant-numeric:tabular-nums;}

  @media(max-width:760px){
    .brand{top:18px;left:18px;}
    .readout{top:16px;right:18px;left:18px;max-width:none;text-align:left;}
    .dock{bottom:18px;width:calc(100% - 36px);justify-content:center;}
    .dock button{padding:11px 13px;font-size:12.5px;}
    .fps{display:none;}
  }
</style>
</head>
<body>

<div class="brand">MVS<span>.</span>lab</div>

<div class="readout">
  <h1 id="rTitle">Forged</h1>
  <p id="rDesc">Polished metal under studio light. Precision, engineering, weight.</p>
</div>

<div id="stage"></div>

<div class="dock">
  <button id="b1" aria-pressed="true">Forged</button>
  <button id="b2" aria-pressed="false">Prism</button>
  <button id="b3" aria-pressed="false">Drift</button>
  <div class="sep"></div>
  <button id="bCard" aria-pressed="false">Card view</button>
</div>

<div class="fps" id="fps">— fps</div>

<!-- mandatory, not stylistic: everything under three's examples/jsm imports the bare specifier
     'three'. Without this map that import is unresolvable, the module dies before it appends a
     canvas, and the page renders as chrome with no scene. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const PAPER = 0xF7F4EF;
const FLARE = 0xE4622F;
const INK   = 0x16130F;

const stage = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
camera.position.set(0, 0, 11.4);

/* RoomEnvironment rather than an HDR file: a real studio reflection with zero network asset, which
   is what makes the metal and the glass read as material instead of as flat shading. */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* one shared lighting rig across all three, so the comparison is about the form and not the light */
const key = new THREE.DirectionalLight(FLARE, 3.4);
key.position.set(-4.5, 3.2, 3.4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xFFFFFF, 1.5);
fill.position.set(4.2, -1.6, 2.6);
scene.add(fill);
scene.add(new THREE.AmbientLight(0xFFFFFF, 0.35));

/* ---- A. FORGED — a machined orbital assembly ----------------------------------------------- */
/* deliberately NOT an organic chrome knot: a smooth metal blob is one of the nine hero directions
   already rejected. This is engineered instead -- concentric machined rings on fixed axes, turning
   at different rates, with a solid core. Precision rather than goo. */
function buildForged(){
  const g = new THREE.Group();
  const steel = new THREE.MeshStandardMaterial({color:0xE4DED3, metalness:1, roughness:0.15});
  const dark  = new THREE.MeshStandardMaterial({color:0x2A2419, metalness:1, roughness:0.32});

  const rings = [
    {r:2.72, t:0.075, rot:[Math.PI/2, 0, 0],        spin:[0, 0.24, 0],   mat:steel},
    {r:2.18, t:0.115, rot:[Math.PI/2, 0.62, 0],     spin:[0, -0.17, 0.05], mat:steel},
    {r:1.64, t:0.135, rot:[1.15, 0, 0.42],          spin:[0.11, 0.3, 0], mat:dark},
    {r:1.12, t:0.09,  rot:[0.4, 1.1, 0],            spin:[0, 0.42, -0.2], mat:steel}
  ];
  const parts = rings.map(cfg=>{
    const m = new THREE.Mesh(new THREE.TorusGeometry(cfg.r, cfg.t, 32, 320), cfg.mat);
    m.rotation.set(...cfg.rot);
    m.userData.spin = cfg.spin;
    m.userData.base = [...cfg.rot];
    g.add(m);
    return m;
  });

  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.52, 3),
    new THREE.MeshStandardMaterial({color:FLARE, metalness:0.35, roughness:0.28,
      emissive:FLARE, emissiveIntensity:0.35})
  );
  g.add(core);

  g.userData.tick = (t)=>{
    parts.forEach(m=>{
      m.rotation.x = m.userData.base[0] + m.userData.spin[0]*t;
      m.rotation.y = m.userData.base[1] + m.userData.spin[1]*t;
      m.rotation.z = m.userData.base[2] + m.userData.spin[2]*t;
    });
    core.rotation.y = t*0.5;
    g.rotation.y = Math.sin(t*0.13)*0.22;
  };
  return g;
}

/* ---- B. PRISM — transmissive glass slab ---------------------------------------------------- */
function buildPrism(){
  const g = new THREE.Group();
  const glass = new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.65, 0),
    new THREE.MeshPhysicalMaterial({
      /* iridescence at full strength over a transmissive surface reads as milk, not glass -- it
         piles a white interference film on top of the refraction. Kept as a faint edge tint only. */
      color:0xFFFFFF, metalness:0, roughness:0,
      transmission:1, thickness:1.15, ior:1.52,
      iridescence:0.22, iridescenceIOR:1.3, iridescenceThicknessRange:[180, 420],
      envMapIntensity:1.5, specularIntensity:1, clearcoat:1, clearcoatRoughness:0
    })
  );
  g.add(glass);
  /* a flare-coloured core behind the glass: the refraction is what makes it read as glass rather
     than as a white blob, and it needs something with colour to bend. */
  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.58, 2),
    new THREE.MeshStandardMaterial({color:FLARE, roughness:0.4, metalness:0.1,
      emissive:FLARE, emissiveIntensity:0.5})
  );
  g.add(core);
  g.userData.tick = (t)=>{
    glass.rotation.y = t*0.26; glass.rotation.x = t*0.15;
    core.position.x = Math.sin(t*0.5)*0.6;
    core.position.y = Math.cos(t*0.38)*0.45;
  };
  return g;
}

/* ---- C. DRIFT — a raking displaced surface ------------------------------------------------- */
function buildDrift(){
  const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(17, 11, 320, 210);
  const mat = new THREE.MeshStandardMaterial({color:0x201B15, roughness:0.34, metalness:0.62});
  /* displacement in the vertex shader, not on the CPU: 67k vertices re-solved per frame from JS
     would cost more than the entire rest of the page. */
  mat.onBeforeCompile = (sh)=>{
    sh.uniforms.uT = {value:0};
    mat.userData.sh = sh;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uT;
        float wave(vec3 p){
          return sin(p.x*0.72 + uT*0.62)*0.42
               + sin(p.y*1.15 - uT*0.44)*0.28
               + sin((p.x+p.y)*0.52 + uT*0.31)*0.34;
        }`)
      .replace('#include <beginnormal_vertex>', `
        float e = 0.06;
        float h  = wave(position);
        float hx = wave(position + vec3(e,0.0,0.0));
        float hy = wave(position + vec3(0.0,e,0.0));
        vec3 objectNormal = normalize(vec3(-(hx-h)/e, -(hy-h)/e, 1.0));`)
      .replace('#include <begin_vertex>', `
        vec3 transformed = vec3(position.x, position.y, position.z + h);`);
  };
  const surf = new THREE.Mesh(geo, mat);
  surf.rotation.set(-0.98, 0, 0.28);
  surf.position.y = -0.8;
  g.add(surf);
  g.userData.tick = (t)=>{ if(mat.userData.sh) mat.userData.sh.uniforms.uT.value = t; };
  return g;
}

const builders = [buildForged, buildPrism, buildDrift];
const meta = [
  ['Forged',  'Polished metal under studio light. Precision, engineering, weight.'],
  ['Prism',   'Refractive glass bending a warm core. Clarity, depth, craft.'],
  ['Drift',   'A dark satin surface moving under a raking light. Calm, systemic, endless.']
];

let current = null, currentIdx = -1;
function select(i){
  if(i === currentIdx) return;
  if(current){ scene.remove(current); disposeTree(current); }
  current = builders[i]();
  scene.add(current);
  currentIdx = i;
  document.getElementById('rTitle').textContent = meta[i][0];
  document.getElementById('rDesc').textContent  = meta[i][1];
  [b1,b2,b3].forEach((b,n)=>b.setAttribute('aria-pressed', String(n===i)));
}
function disposeTree(root){
  root.traverse(o=>{
    if(o.geometry) o.geometry.dispose();
    if(o.material) (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());
  });
}

const b1 = document.getElementById('b1'), b2 = document.getElementById('b2'), b3 = document.getElementById('b3');
const SLUGS = ['forged','prism','drift'];
b1.onclick = ()=>go(0);
b2.onclick = ()=>go(1);
b3.onclick = ()=>go(2);

const bCard = document.getElementById('bCard');
function setCard(on){
  document.body.classList.toggle('carded', on);
  bCard.setAttribute('aria-pressed', String(on));
}
bCard.onclick = ()=>{ setCard(!document.body.classList.contains('carded')); writeHash(); };

/* each direction gets its own URL so a single link opens exactly what is being discussed */
function writeHash(){
  const card = document.body.classList.contains('carded') ? ',card' : '';
  history.replaceState(null, '', '#' + SLUGS[currentIdx] + card);
}
function go(i){ select(i); writeHash(); }
function readHash(){
  const parts = location.hash.replace('#','').split(',');
  const i = SLUGS.indexOf(parts[0]);
  select(i < 0 ? 0 : i);
  setCard(parts.includes('card'));
}
addEventListener('hashchange', readHash);

/* pointer parallax — the whole point of a sculpture is that it has sides */
let px = 0, py = 0, tx = 0, ty = 0;
addEventListener('pointermove', e=>{
  tx = (e.clientX / innerWidth  - 0.5) * 2;
  ty = (e.clientY / innerHeight - 0.5) * 2;
}, {passive:true});

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const fpsEl = document.getElementById('fps');
let frames = 0, last = performance.now();
const clock = new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  px += (tx - px) * 0.05;
  py += (ty - py) * 0.05;
  camera.position.x = px * 0.9;
  camera.position.y = -py * 0.6;
  camera.lookAt(0, 0, 0);
  if(current && current.userData.tick) current.userData.tick(t);
  renderer.render(scene, camera);

  frames++;
  const now = performance.now();
  if(now - last >= 1000){ fpsEl.textContent = frames + ' fps'; frames = 0; last = now; }
}

readHash();
loop();
</script>
</body>
</html>
